server:
  port: 0

spring:
  application:
    name: boltpay-backend-test
  datasource:
    url: jdbc:h2:mem:boltpaytest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

app:
  jwt:
    secret: boltpay-super-secret-key-32-bytes-minimum-length-key-12345678
    expiration-ms: 86400000
  cors:
    allowed-origins: "*"
